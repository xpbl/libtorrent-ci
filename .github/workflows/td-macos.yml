name: Build td CLI (macOS)

# Manually triggered release build: clones toodrive from Codeberg, builds static
# libtorrent 2.1.0, links it into libtd_torrent, then `deno compile` into a
# standalone `td` binary. Uploads the binary + the .dylib as artifacts.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "toodrive git ref (branch/tag/commit) to build"
        required: true
        default: "main"
      libtorrent_version:
        description: "libtorrent git tag/branch"
        required: true
        default: "RC_2_1"
      release:
        description: "Create a GitHub release with the built artifacts"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: macos-arm64
    runs-on: macos-latest

    env:
      boost_path: "${{ github.workspace }}/boost"
      libtorrent_path: "${{ github.workspace }}/libtorrent"
      td_dir: "${{ github.workspace }}/toodrive"

    steps:
      - name: Install dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew update > /dev/null
          brew install openssl@3 zlib

      - name: Fetch boost (headers only)
        run: |
          curl -L -o /tmp/boost.tar.gz "https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.gz"
          tar -xf /tmp/boost.tar.gz -C "${{ github.workspace }}"
          mv "${{ github.workspace }}"/boost_* "${{ env.boost_path }}"
          cd "${{ env.boost_path }}"
          ./bootstrap.sh
          ./b2 stage --stagedir=./ --with-headers

      - name: Fetch libtorrent ${{ inputs.libtorrent_version }}
        run: |
          git clone \
            --branch ${{ inputs.libtorrent_version }} \
            --depth 1 \
            --recurse-submodules \
            https://github.com/arvidn/libtorrent.git \
            ${{ env.libtorrent_path }}

      - name: Build libtorrent (static)
        run: |
          cd ${{ env.libtorrent_path }}
          cmake \
            -B build \
            -G "Ninja" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_FLAGS="-fvisibility=default" \
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" \
            -Ddeprecated-functions=OFF \
            -Dwebtorrent=OFF
          cmake --build build
          find build -name "libtorrent-rasterbar.a"

      - name: Clone toodrive
        run: |
          git clone \
            --branch ${{ inputs.ref }} \
            --depth 1 \
            https://codeberg.org/bl/toodrive.git \
            ${{ env.td_dir }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build libtd_torrent (static link against libtorrent.a)
        run: |
          cd ${{ env.td_dir }}/cli/native
          LT_A=$(find "${{ env.libtorrent_path }}/build" -name "libtorrent-rasterbar.a" | head -1)
          OSSL_PREFIX=$(brew --prefix openssl@3)
          ZLIB_PREFIX=$(brew --prefix zlib)
          echo "linking against $LT_A"
          clang++ -shared -fPIC -O2 -std=c++20 \
            -DTORRENT_ABI_VERSION=100 \
            -DBOOST_ASIO_ENABLE_CANCELIO -DBOOST_ASIO_NO_DEPRECATED \
            -DTORRENT_USE_OPENSSL -DTORRENT_USE_LIBCRYPTO -DTORRENT_SSL_PEERS \
            -I"${{ env.boost_path }}" \
            -I"${{ env.libtorrent_path }}/include" \
            -I"$OSSL_PREFIX/include" \
            -o libtd_torrent.dylib td_torrent.cpp \
            "$LT_A" \
            "$OSSL_PREFIX/lib/libssl.a" \
            "$OSSL_PREFIX/lib/libcrypto.a" \
            "$ZLIB_PREFIX/lib/libz.a" \
            -framework CoreFoundation -framework SystemConfiguration
          echo "=== runtime deps ==="
          otool -L libtd_torrent.dylib

      - name: Compile td binary
        run: |
          cd ${{ env.td_dir }}/cli
          deno compile -A \
            --include native/libtd_torrent.dylib \
            --output td main.ts
          ./td torrent --help

      - name: Upload td binary
        uses: actions/upload-artifact@v4
        with:
          name: td-macos-arm64-${{ inputs.ref }}
          path: ${{ env.td_dir }}/cli/td
          retention-days: 90

      - name: Upload libtd_torrent.dylib
        uses: actions/upload-artifact@v4
        with:
          name: libtd_torrent-macos-arm64-${{ inputs.ref }}
          path: ${{ env.td_dir }}/cli/native/libtd_torrent.dylib
          retention-days: 90

      - name: Prepare release asset
        if: inputs.release
        run: |
          cp "${{ env.td_dir }}/cli/td" "${{ runner.temp }}/td-macos-arm64"

      - name: Checkout release helper
        if: inputs.release
        uses: actions/checkout@v4

      - name: Allocate GitHub release
        if: inputs.release
        id: release_slot
        uses: actions/github-script@v9
        env:
          RELEASE_PRODUCT: td
          RELEASE_ASSET_NAME: td-macos-arm64
        with:
          script: |
            const { allocateCurrentRelease } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-slot.js`,
            );
            await allocateCurrentRelease({ github, context, core });

      - name: Upload release asset
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload -R "$GITHUB_REPOSITORY" "${{ steps.release_slot.outputs.tag }}" \
            "${{ runner.temp }}/td-macos-arm64#macOS arm64"

      - name: Update release metadata
        if: inputs.release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.release_slot.outputs.tag }}
        with:
          script: |
            const { refreshCurrentReleaseMetadata } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/release-slot.js`,
            );
            await refreshCurrentReleaseMetadata({ github, context });
