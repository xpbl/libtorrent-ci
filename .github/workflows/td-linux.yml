name: Build td CLI (Linux)

# Manually triggered release build: clones toodrive from Codeberg, builds static
# libtorrent 2.1.0, links it into libtd_torrent, then `deno compile` into a
# standalone `td` binary. Uploads the binary + the .so as artifacts.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "toodrive git ref (branch/tag/commit) to build"
        required: true
        default: "main"
      libtorrent_version:
        description: "libtorrent git tag/branch"
        required: true
        default: "RC_2_1"
      release:
        description: "Create a GitHub release with the built artifacts"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: linux-x86_64
    runs-on: ubuntu-latest

    env:
      boost_path: "${{ github.workspace }}/boost"
      libtorrent_path: "${{ github.workspace }}/libtorrent"
      td_dir: "${{ github.workspace }}/toodrive"

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build pkg-config curl unzip

      - name: Fetch boost (headers only)
        run: |
          curl -L -o /tmp/boost.tar.gz "https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.gz"
          tar -xf /tmp/boost.tar.gz -C "${{ github.workspace }}"
          mv "${{ github.workspace }}"/boost_* "${{ env.boost_path }}"
          cd "${{ env.boost_path }}"
          ./bootstrap.sh
          ./b2 stage --stagedir=./ --with-headers

      - name: Fetch libtorrent ${{ inputs.libtorrent_version }}
        run: |
          git clone \
            --branch ${{ inputs.libtorrent_version }} \
            --depth 1 \
            --recurse-submodules \
            https://github.com/arvidn/libtorrent.git \
            ${{ env.libtorrent_path }}

      - name: Build libtorrent (static)
        run: |
          cd ${{ env.libtorrent_path }}
          cmake \
            -B build \
            -G "Ninja" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CXX_FLAGS="-fvisibility=default" \
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" \
            -Ddeprecated-functions=OFF \
            -Dwebtorrent=OFF
          cmake --build build
          find build -name "libtorrent-rasterbar.a"

      - name: Install static OpenSSL + zlib
        run: |
          sudo apt install -y libssl-dev zlib1g-dev
          ls -la /usr/lib/x86_64-linux-gnu/libssl.a \
                 /usr/lib/x86_64-linux-gnu/libcrypto.a \
                 /usr/lib/x86_64-linux-gnu/libz.a

      - name: Clone toodrive
        run: |
          git clone \
            --branch ${{ inputs.ref }} \
            --depth 1 \
            https://codeberg.org/bl/toodrive.git \
            ${{ env.td_dir }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build libtd_torrent (static link against libtorrent.a)
        run: |
          cd ${{ env.td_dir }}/cli/native
          LT_A=$(find "${{ env.libtorrent_path }}/build" -name "libtorrent-rasterbar.a" | head -1)
          echo "linking against $LT_A"
          g++ -shared -fPIC -O2 -std=c++20 \
            -DTORRENT_ABI_VERSION=100 \
            -DBOOST_ASIO_ENABLE_CANCELIO -DBOOST_ASIO_NO_DEPRECATED \
            -DTORRENT_USE_OPENSSL -DTORRENT_USE_LIBCRYPTO -DTORRENT_SSL_PEERS \
            -I"${{ env.boost_path }}" \
            -I"${{ env.libtorrent_path }}/include" \
            -Wl,--no-undefined \
            -o libtd_torrent.so td_torrent.cpp \
            "$LT_A" \
            /usr/lib/x86_64-linux-gnu/libssl.a \
            /usr/lib/x86_64-linux-gnu/libcrypto.a \
            /usr/lib/x86_64-linux-gnu/libz.a \
            -ldl -lpthread
          echo "=== runtime deps (should be no libtorrent/ssl/crypto/z) ==="
          ldd -r libtd_torrent.so

      - name: Compile td binary
        run: |
          cd ${{ env.td_dir }}/cli
          deno compile -A \
            --include native/libtd_torrent.so \
            --output td main.ts
          # Exercise module evaluation and Deno.dlopen; the runtime's own
          # --version fast-path can exit before loading the embedded FFI library.
          ./td torrent --help

      - name: Upload td binary
        uses: actions/upload-artifact@v4
        with:
          name: td-linux-x86_64-${{ inputs.ref }}
          path: ${{ env.td_dir }}/cli/td
          retention-days: 90

      - name: Upload libtd_torrent.so
        uses: actions/upload-artifact@v4
        with:
          name: libtd_torrent-linux-x86_64-${{ inputs.ref }}
          path: ${{ env.td_dir }}/cli/native/libtd_torrent.so
          retention-days: 90

      - name: Prepare release asset
        if: inputs.release
        run: |
          cp "${{ env.td_dir }}/cli/td" "${{ runner.temp }}/td-linux-x86_64"

      - name: Create GitHub release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="td-$(date -u +%Y%m%d%H%M%SZ)"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "${{ runner.temp }}/td-linux-x86_64"
