name: Build td CLI (Windows)

# Manually triggered release build: clones toodrive from Codeberg, builds static
# libtorrent 2.1.0 (MSVC), links it into libtd_torrent.dll, then `deno compile`
# into a standalone td.exe. Uploads the exe + the dll as artifacts.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "toodrive git ref (branch/tag/commit) to build"
        required: true
        default: "main"
      libtorrent_version:
        description: "libtorrent git tag/branch"
        required: true
        default: "RC_2_1"

permissions: {}

jobs:
  build:
    name: windows-x64
    runs-on: windows-latest

    env:
      boost_path: "${{ github.workspace }}/boost"
      libtorrent_path: "${{ github.workspace }}/libtorrent"
      td_dir: "${{ github.workspace }}/toodrive"
      vcpkg_path: "c:/vcpkg"

    steps:
      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install ninja
        run: |
          if ((Get-Command "ninja.exe" -ErrorAction SilentlyContinue) -eq $null) { choco install ninja }
          ninja --version

      - name: Set variables for vcpkg binary cache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', (process.env.ACTIONS_CACHE_URL || ''));
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', (process.env.ACTIONS_RUNTIME_TOKEN || ''));

      - name: Install openssl + zlib (static) via vcpkg
        run: |
          New-Item -Force -ItemType File `
            -Path "${{ env.vcpkg_path }}/triplets_overlay/x64-windows-static-md-release.cmake"
          Add-Content `
            -Path "${{ env.vcpkg_path }}/triplets_overlay/x64-windows-static-md-release.cmake" `
            -Value @("set(VCPKG_TARGET_ARCHITECTURE x64)",
              "set(VCPKG_LIBRARY_LINKAGE static)",
              "set(VCPKG_CRT_LINKAGE dynamic)",
              "set(VCPKG_BUILD_TYPE release)")
          $packages = `
            "openssl:x64-windows-static-md-release",
            "zlib:x64-windows-static-md-release"
          ${{ env.vcpkg_path }}/vcpkg.exe install `
            --binarysource="clear;x-gha,readwrite" `
            --clean-after-build `
            --overlay-triplets="${{ env.vcpkg_path }}/triplets_overlay" `
            $packages

      - name: Fetch boost (headers only)
        run: |
          curl -L -o "${{ runner.temp }}/boost.tar.gz" "https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.gz"
          tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}"
          move "${{ github.workspace }}/boost_*" "${{ env.boost_path }}"
          # libtorrent 2.x needs only Boost headers, which are already in the
          # extracted tree at <boost_path>/boost/. No bootstrap/b2 required.

      - name: Fetch libtorrent ${{ inputs.libtorrent_version }}
        run: |
          git clone `
            --branch ${{ inputs.libtorrent_version }} `
            --depth 1 `
            --recurse-submodules `
            https://github.com/arvidn/libtorrent.git `
            ${{ env.libtorrent_path }}

      - name: Build libtorrent (static)
        run: |
          cd ${{ env.libtorrent_path }}
          cmake `
            -B build `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.vcpkg_path }}/scripts/buildsystems/vcpkg.cmake" `
            -DBOOST_ROOT="${{ env.boost_path }}" `
            -DBoost_INCLUDE_DIR="${{ env.boost_path }}" `
            -DBUILD_SHARED_LIBS=OFF `
            -Ddeprecated-functions=OFF `
            -Dstatic_runtime=OFF `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md-release `
            -Dwebtorrent=OFF
          cmake --build build --config Release
          Get-ChildItem -Recurse -Path build -Filter "torrent-rasterbar.lib"

      - name: Clone toodrive
        run: |
          git clone `
            --branch ${{ inputs.ref }} `
            --depth 1 `
            https://codeberg.org/bl/toodrive.git `
            ${{ env.td_dir }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build libtd_torrent.dll (static link against torrent-rasterbar.lib)
        run: |
          cd ${{ env.td_dir }}/cli/native
          $lt = (Get-ChildItem -Recurse -Path "${{ env.libtorrent_path }}/build" -Filter "torrent-rasterbar.lib" | Select-Object -First 1).FullName
          $triplet = "${{ env.vcpkg_path }}/installed/x64-windows-static-md-release"
          Write-Host "linking against $lt"
          Write-Host "=== triplet lib dir ==="
          Get-ChildItem "$triplet/lib" -Filter *.lib | Select-Object -ExpandProperty Name
          # zlib's static lib name varies by port/triplet: zlib.lib, zlibstatic.lib,
          # z.lib, or zs.lib (zlib static). Resolve whichever exists.
          $zlib = Get-ChildItem "$triplet/lib" -Filter *.lib |
            Where-Object { $_.Name -match '^(zlib|zlibstatic|zs|z)\.lib$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $zlib) { throw "no zlib .lib found under $triplet/lib" }
          Write-Host "using zlib: $zlib"
          cl /LD /O2 /std:c++20 /MD /EHsc `
            /DTORRENT_ABI_VERSION=100 `
            /DBOOST_ASIO_ENABLE_CANCELIO /DBOOST_ASIO_NO_DEPRECATED `
            /DTORRENT_USE_OPENSSL /DTORRENT_USE_LIBCRYPTO /DTORRENT_SSL_PEERS `
            /I"${{ env.boost_path }}" `
            /I"${{ env.libtorrent_path }}/include" `
            /I"$triplet/include" `
            td_torrent.cpp `
            /link `
            "$lt" `
            "$triplet/lib/libssl.lib" `
            "$triplet/lib/libcrypto.lib" `
            "$zlib" `
            ws2_32.lib iphlpapi.lib crypt32.lib advapi32.lib bcrypt.lib dbghelp.lib user32.lib `
            /OUT:libtd_torrent.dll
          Write-Host "=== runtime deps ==="
          dumpbin /dependents libtd_torrent.dll

      - name: Compile td.exe
        run: |
          cd ${{ env.td_dir }}/cli
          deno compile -A `
            --include native/libtd_torrent.dll `
            --output td.exe main.ts
          .\td.exe torrent --help

      - name: Upload td.exe
        uses: actions/upload-artifact@v4
        with:
          name: td-windows-x64-${{ inputs.ref }}
          path: ${{ env.td_dir }}/cli/td.exe
          retention-days: 90

      - name: Upload libtd_torrent.dll
        uses: actions/upload-artifact@v4
        with:
          name: libtd_torrent-windows-x64-${{ inputs.ref }}
          path: ${{ env.td_dir }}/cli/native/libtd_torrent.dll
          retention-days: 90
