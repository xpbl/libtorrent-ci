name: Build libtorrent static (Windows)

# Manually triggered build farm: compiles libtorrent 2.1.0 as a static library
# and uploads the .lib + headers as an artifact for the toodrive CLI to link against.
on:
  workflow_dispatch:
    inputs:
      libtorrent_version:
        description: "libtorrent git tag/branch"
        required: true
        default: "RC_2_1"

permissions: {}

jobs:
  build:
    name: windows-x64
    runs-on: windows-latest

    env:
      boost_path: "${{ github.workspace }}/boost"
      libtorrent_path: "${{ github.workspace }}/libtorrent"
      out_dir: "${{ github.workspace }}/out"
      vcpkg_path: "c:/vcpkg"

    steps:
      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install ninja
        run: |
          if ((Get-Command "ninja.exe" -ErrorAction SilentlyContinue) -eq $null) { choco install ninja }
          ninja --version

      - name: Set variables for vcpkg binary cache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', (process.env.ACTIONS_CACHE_URL || ''));
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', (process.env.ACTIONS_RUNTIME_TOKEN || ''));

      - name: Install openssl + zlib (static) via vcpkg
        run: |
          New-Item -Force -ItemType File `
            -Path "${{ env.vcpkg_path }}/triplets_overlay/x64-windows-static-md-release.cmake"
          Add-Content `
            -Path "${{ env.vcpkg_path }}/triplets_overlay/x64-windows-static-md-release.cmake" `
            -Value @("set(VCPKG_TARGET_ARCHITECTURE x64)",
              "set(VCPKG_LIBRARY_LINKAGE static)",
              "set(VCPKG_CRT_LINKAGE dynamic)",
              "set(VCPKG_BUILD_TYPE release)")
          $packages = `
            "openssl:x64-windows-static-md-release",
            "zlib:x64-windows-static-md-release"
          ${{ env.vcpkg_path }}/vcpkg.exe install `
            --binarysource="clear;x-gha,readwrite" `
            --clean-after-build `
            --overlay-triplets="${{ env.vcpkg_path }}/triplets_overlay" `
            $packages

      - name: Fetch boost (headers only)
        run: |
          $boost_url="https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.gz"
          curl -L -o "${{ runner.temp }}/boost.tar.gz" "$boost_url"
          tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}"
          move "${{ github.workspace }}/boost_*" "${{ env.boost_path }}"
          # libtorrent 2.x needs only Boost headers, already at <boost_path>/boost/.
          # No bootstrap/b2 required (bootstrap.bat fails on newer MSVC toolsets).

      - name: Fetch libtorrent ${{ inputs.libtorrent_version }}
        run: |
          git clone `
            --branch ${{ inputs.libtorrent_version }} `
            --depth 1 `
            --recurse-submodules `
            https://github.com/arvidn/libtorrent.git `
            ${{ env.libtorrent_path }}

      - name: Build libtorrent (static)
        run: |
          cd ${{ env.libtorrent_path }}
          cmake `
            -B build `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.vcpkg_path }}/scripts/buildsystems/vcpkg.cmake" `
            -DBOOST_ROOT="${{ env.boost_path }}" `
            -DBoost_INCLUDE_DIR="${{ env.boost_path }}" `
            -DBUILD_SHARED_LIBS=OFF `
            -Ddeprecated-functions=OFF `
            -Dstatic_runtime=OFF `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md-release `
            -Dwebtorrent=OFF
          cmake --build build --config Release

      - name: Package static lib + headers
        run: |
          mkdir "${{ env.out_dir }}/lib"
          mkdir "${{ env.out_dir }}/include"
          Get-ChildItem -Recurse -Path "${{ env.libtorrent_path }}/build" -Filter "torrent-rasterbar.lib" |
            Copy-Item -Destination "${{ env.out_dir }}/lib/"
          Copy-Item -Recurse "${{ env.libtorrent_path }}/include/libtorrent" "${{ env.out_dir }}/include/"
          @"
          libtorrent ${{ inputs.libtorrent_version }} static (Windows x64, MSVC, dynamic CRT)
          link: torrent-rasterbar.lib + openssl + zlib (see vcpkg triplet x64-windows-static-md)
          defines: TORRENT_LINKING_STATIC BOOST_ASIO_ENABLE_CANCELIO TORRENT_USE_OPENSSL TORRENT_USE_LIBCRYPTO TORRENT_SSL_PEERS
          NOTE: built with static_runtime=OFF (/MD). Consumers must also use /MD to match the CRT.
          "@ | Out-File -Encoding utf8 "${{ env.out_dir }}/README.txt"
          Get-ChildItem "${{ env.out_dir }}/lib"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtorrent-static-windows-x64-${{ inputs.libtorrent_version }}
          path: ${{ env.out_dir }}
          retention-days: 90
